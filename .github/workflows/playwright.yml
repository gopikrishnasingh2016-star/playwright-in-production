name: Playwright Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 02:30 UTC = 08:00 IST. A nightly run against LIVE sites is the point:
    # it tells me when a target changed, which is the whole exercise.
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  api:
    name: API tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # No browser download at all for the API project — this job finishes
      # in about a minute, which is why API coverage belongs in its own job.
      - name: Run API tests
        run: npx playwright test --project=api
        env:
          # Raises the GitHub API limit from 60/hr to 5,000/hr.
          # GITHUB_TOKEN is provided automatically by Actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-report
          path: playwright-report/
          retention-days: 14

  ui:
    name: UI (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run UI tests
        run: npx playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  publish-report:
    name: Publish HTML report to Pages
    runs-on: ubuntu-latest
    needs: [api, ui]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-report-chromium
          path: ./report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./report/playwright-report
      - id: deploy
        uses: actions/deploy-pages@v4
